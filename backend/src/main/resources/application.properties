# ============================================================
#  DRRO — application.properties
#  All secrets are loaded from .env via spring-dotenv.
#  DO NOT hardcode credentials here — edit .env instead.
# ============================================================

# ----- Server -----
server.port=${SERVER_PORT:8080}
spring.application.name=drro-backend

# ----- Supabase / PostgreSQL Connection -----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ----- JPA / Hibernate -----
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ----- Connection Pool (HikariCP) -----
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# ----- JWT Configuration -----
drro.jwt.secret=${JWT_SECRET}
drro.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ----- CORS -----
drro.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ----- Logging -----
logging.level.com.drro=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ----- OpenAPI / Swagger -----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
