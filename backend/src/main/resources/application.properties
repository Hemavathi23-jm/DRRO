# ============================================================
#  DRRO — application.properties
#  All secrets are loaded from .env via spring-dotenv.
#  DO NOT hardcode credentials here — edit .env instead.
# ============================================================

# ----- Server -----
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
server.port=${PORT:${SERVER_PORT:8080}}
spring.application.name=drro-backend

# ----- Supabase / PostgreSQL Connection -----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ----- JPA / Hibernate -----
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ----- Connection Pool (HikariCP) -----
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000

# ----- JWT Configuration -----
drro.jwt.secret=${JWT_SECRET}
drro.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ----- CORS -----
drro.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# ----- Logging -----
logging.level.com.drro=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ----- External web scraping (GDACS, USGS, EONET, ReliefWeb) -----
# Continuous auto-fetch every 5 minutes by default (override with EXTERNAL_SCRAPE_INTERVAL_MS)
drro.external.enabled=${EXTERNAL_SCRAPE_ENABLED:true}
drro.external.fetch-on-startup=${EXTERNAL_SCRAPE_ON_STARTUP:true}
drro.external.fetch-interval-ms=${EXTERNAL_SCRAPE_INTERVAL_MS:300000}
drro.external.timeout-ms=${EXTERNAL_SCRAPE_TIMEOUT_MS:20000}
drro.external.user-agent=${EXTERNAL_SCRAPE_USER_AGENT:DRRO/1.0 (academic disaster-management project)}
drro.external.gdacs-enabled=${EXTERNAL_GDACS_ENABLED:true}
drro.external.gdacs-url=${EXTERNAL_GDACS_URL:https://www.gdacs.org/xml/rss.xml}
drro.external.gdacs-max-records=${EXTERNAL_GDACS_MAX:40}
drro.external.usgs-enabled=${EXTERNAL_USGS_ENABLED:true}
drro.external.usgs-url=${EXTERNAL_USGS_URL:https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.atom}
drro.external.usgs-min-magnitude=${EXTERNAL_USGS_MIN_MAG:4.5}
drro.external.osm-enabled=${EXTERNAL_OSM_ENABLED:true}
drro.external.osm-url=${EXTERNAL_OSM_URL:https://overpass-api.de/api/interpreter}
drro.external.osm-radius-m=${EXTERNAL_OSM_RADIUS_M:15000}
drro.external.osm-max-results=${EXTERNAL_OSM_MAX:12}
drro.external.eonet-enabled=${EXTERNAL_EONET_ENABLED:true}
drro.external.eonet-url=${EXTERNAL_EONET_URL:https://eonet.gsfc.nasa.gov/api/v3/events?status=open&limit=80}
drro.external.eonet-max-records=${EXTERNAL_EONET_MAX:40}
# ----- SMS Notifications (Twilio / Fast2SMS / Simulator) -----
drro.sms.enabled=${SMS_ENABLED:true}
drro.sms.provider=${SMS_PROVIDER:twilio}
drro.sms.admin-phone=${ADMIN_PHONE_NUMBER:+15550199}
drro.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
drro.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
drro.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}
drro.sms.fast2sms.api-key=${FAST2SMS_API_KEY:}

# ----- OpenAPI / Swagger -----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

